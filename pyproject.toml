[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-agent"
version = "1.3.0"
description = "Autonomous hourly news intelligence pipeline — fetch, deduplicate, deep-read, synthesize, and deliver audio briefings via Telegram"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AI Consy", email = "ai-consy@users.noreply.github.com"},
]
keywords = ["news", "rss", "briefing", "podcast", "tts", "telegram", "ollama", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    # Pinned with upper bounds: a future major release cannot silently break the
    # pipeline. Rule: >=floor,<next_major (pre-1.0: <0.(minor+2)).
    "feedparser>=6.0,<7",
    "trafilatura>=1.6,<3",
    "readability-lxml>=0.4,<1",
    "lxml[html_clean]>=5.0,<7",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "edge-tts>=6.1,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "pytest-cov>=4.0,<8",
    "ruff>=0.1,<1",
]
# Piper is an external binary plus a voice model, set with PIPER_BIN and
# PIPER_MODEL. The pip package does not include a voice, so it is not installed
# by default.

[tool.setuptools.package-data]
ai_news_agent = ["data/*.json"]

[project.scripts]
ai-news = "ai_news_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ai_news_agent*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]