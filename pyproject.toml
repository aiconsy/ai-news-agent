[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-agent"
version = "1.0.0"
description = "Autonomous hourly news intelligence pipeline — fetch, deduplicate, deep-read, synthesize, and deliver audio briefings via Telegram"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AI Consy", email = "ai-consy@users.noreply.github.com"},
]
keywords = ["news", "rss", "briefing", "podcast", "tts", "telegram", "ollama", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    "feedparser>=6.0",
    "trafilatura>=1.6",
    "readability-lxml>=0.4",
    "lxml[html_clean]>=5.0",
    "requests>=2.31",
    "edge-tts>=6.1",
    "pydub>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
ai-news = "ai_news_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ai_news_agent*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]